<!DOCTYPE html>

  <title>工业热工流程与参数可视化核对系统 (方案3：正弦连续波浪 + 拱桥立交走线)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: {
              bg: '#FAF7EE', card: '#FFFFFF', border: '#E2DDD2', borderDark: '#78716C',

  <style>

    .bg-paper-grid {
      background-color: #FAF7EE;
      background-image: radial-gradient(#DDD6C6 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
    .flow-node-box {
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      transition: box-shadow 0.16s ease-out, border-color 0.16s ease-out, transform 0.12s ease-out;
      cursor: grab;
      user-select: none;
    }
    .flow-node-box:active { cursor: grabbing; }
    .flow-node-box:hover { border-color: #0F172A; box-shadow: 0 6px 18px -3px rgba(15, 23, 42, 0.12); }
    .flow-node-box.selected {
      border-color: #0F172A !important;
      box-shadow: 0 0 0 2px #FFD600, 0 8px 20px -3px rgba(15, 23, 42, 0.18) !important;
    }
    .node-constant { width: 130px; background: #FEFCE8; border: 1px solid #FEF08A; border-radius: 6px; }
    .node-constant:hover { border-color: #D97706; }
    .node-input { width: 130px; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 6px; }
    .node-input:hover { border-color: #16A34A; }
    .node-step { width: 270px; background: #FFFFFF; border: 1px solid #BFDBFE; border-radius: 8px; }

    .wire-base { fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke-width 0.15s ease, stroke 0.15s ease, opacity 0.15s ease; }
    .wire-input { stroke: #16A34A; stroke-width: 1.8; opacity: 0.75; }
    .wire-constant { stroke: #D97706; stroke-width: 1.8; stroke-dasharray: 4 2; opacity: 0.75; }
    .wire-step { stroke: #2563EB; stroke-width: 2.0; opacity: 0.85; }
    .wire-flyover { stroke: #4F46E5; stroke-width: 2.2; stroke-dasharray: 6 3; opacity: 0.85; }

<body class="bg-paper-bg text-paper-text font-sans antialiased h-screen flex flex-col overflow-hidden select-none">
  <!-- 顶部控制栏 (保持所有原有功能与接口完全一致) -->
  <header class="h-14 bg-white border-b border-paper-border px-6 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-4">
      <div class="flex bg-[#EFECE4] p-1 rounded border border-[#DFD9CB] text-xs">
        <button id="tab-stage-1" onclick="switchStage(1)" class="px-4 py-1 rounded font-bold bg-white shadow-xs">阶段 01</button>
        <button id="tab-stage-2" onclick="switchStage(2)" class="px-4 py-1 rounded font-bold text-paper-muted">阶段 02</button>
      </div>
      <span id="stage-desc-hint" class="text-xs font-bold text-slate-700">流程拓扑审核</span>
      <span class="text-xs px-2 py-0.5 rounded font-black bg-indigo-100 text-indigo-900 border border-indigo-200">方案 3 演示：正弦连续波浪 + 拱桥外环立交</span>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="openAddOperatorModal()" class="px-3 py-1.5 text-xs font-bold border border-slate-300 bg-white hover:bg-slate-50 rounded flex items-center gap-1 transition-all">+ 新增算子</button>
      <button onclick="openAddConstantModal()" class="px-3 py-1.5 text-xs font-bold border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 rounded flex items-center gap-1 transition-all">+ 新增常量</button>
      <button onclick="resetLayoutPositions()" class="px-3 py-1.5 text-xs text-slate-600 hover:text-black font-bold">恢复默认排版</button>
      <button id="btn-main-action" onclick="handlePrimaryAction()" class="px-5 py-1.5 text-xs font-black bg-paper-yellow hover:bg-paper-yellowHover text-black border border-black shadow-[2px_2px_0px_#0F172A] transition-transform active:translate-x-0.5 active:translate-y-0.5">确认场景拓扑</button>
    </div>
  </header>

  <div id="editor-message" role="alert" class="hidden px-6 py-2 text-xs font-bold bg-red-50 text-red-800 border-b border-red-200"></div>

  <!-- 主视口：DAG 画布与侧边栏抽屉 -->
  <div class="flex-1 flex overflow-hidden relative">
    <main id="canvas-container" class="flex-1 overflow-hidden bg-paper-grid relative canvas-panning">
      <div id="dag-workspace" class="relative select-text" style="transform-origin:0 0;margin:30px 40px;will-change:transform">
        <svg id="svg-wiring-layer" class="absolute inset-0 pointer-events-none" style="overflow:visible" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow-step" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/></marker>
            <marker id="arrow-input" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/></marker>
            <marker id="arrow-const" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/></marker>
            <marker id="arrow-flyover" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4F46E5"/></marker>
            <marker id="arrow-highlight" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/></marker>
          </defs>
        </svg>

        <div id="node-layer"></div>

        <div id="node-floating-toolbar" class="hidden absolute z-30 bg-slate-900 text-white rounded shadow-xl px-2 py-1 flex gap-2 text-xs font-bold">
          <button onclick="triggerInsertBefore()">⬅ 前插算子</button>
          <button onclick="triggerInsertAfter()">➡ 后插算子</button>
          <button onclick="triggerReplace()" class="text-yellow-300">⇄ 替换</button>
          <button onclick="triggerDeleteCurrent()" class="text-red-300">删除</button>
        </div>
      </div>

      <div class="absolute bottom-3 left-5 bg-white/95 px-4 py-2 border border-paper-border rounded shadow-xs flex gap-5 text-[11px] font-bold pointer-events-none">
        <span class="text-softPin-inText flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-softPin-inDot"></span>输入引脚</span>
        <span class="text-softPin-opText flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-softPin-opDot"></span>公式算子</span>
        <span class="text-softPin-constText flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-softPin-constDot"></span>工程常量</span>
        <span class="text-softPin-outText flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-softPin-outDot"></span>输出成果</span>
      </div>
    </main>

    <!-- 侧边抽屉 -->
    <aside id="operator-drawer" class="absolute top-0 right-0 bottom-0 w-[390px] max-w-full bg-white border-l border-paper-border shadow-xl z-40 flex flex-col translate-x-full transition-transform">
      <div class="px-5 py-4 border-b border-paper-border flex justify-between font-black text-sm"><span id="drawer-title">算子属性与流水线操作</span><button onclick="closeDrawer()" class="text-slate-400 hover:text-slate-700">✕</button></div>
      <div id="drawer-actions" class="p-3 flex justify-between text-xs border-b border-paper-border">
        <button onclick="triggerInsertBefore()" class="px-2 py-1 hover:bg-slate-100 rounded">⬅ 前插</button>
        <button onclick="triggerInsertAfter()" class="px-2 py-1 hover:bg-slate-100 rounded">➡ 后插</button>
        <button onclick="triggerReplace()" class="px-2 py-1 hover:bg-slate-100 rounded text-blue-700 font-bold">⇄ 替换</button>
        <button onclick="triggerDeleteCurrent()" class="px-2 py-1 hover:bg-red-50 text-red-700 font-bold rounded">删除</button>
      </div>
      <div class="flex-1 overflow-auto p-5 space-y-4 text-xs">
        <label class="block font-bold">算子标识<input id="drawer-id" readonly class="mt-1 w-full p-2 border rounded bg-slate-50 font-mono text-slate-600"></label>
        <label class="block font-bold">名称<input id="drawer-name" class="mt-1 w-full p-2 border rounded"></label>
        <label id="drawer-formula-label" class="block font-bold">代数公式<textarea id="drawer-formula" rows="3" class="mt-1 w-full p-2 border border-blue-300 rounded font-mono text-blue-950"></textarea></label>
        <label id="drawer-desc-label" class="block font-bold">工程物理机制<textarea id="drawer-desc" rows="3" class="mt-1 w-full p-2 border rounded"></textarea></label>
        <label id="drawer-target-label" class="block font-bold">本次计算<select id="drawer-target" onchange="changeSolveTarget()" class="mt-1 w-full p-2 border rounded"></select></label>
        <div id="drawer-pins" class="space-y-3"></div>
      </div>
      <div class="p-4 border-t flex justify-end gap-3"><button onclick="closeDrawer()" class="text-xs font-bold px-3 py-2">取消</button><button onclick="saveDrawer()" class="px-4 py-2 bg-slate-900 text-white rounded text-xs font-bold">保存修改</button></div>
    </aside>
  </div>

  <!-- 模态框保持原样 -->
  <div id="modal-add-op" class="hidden fixed inset-0 z-50 bg-black/25 flex items-center justify-center">
    <div class="bg-white rounded shadow-xl w-[520px] max-h-[90vh] overflow-auto border border-paper-border">
      <div class="px-5 py-4 bg-paper-yellow flex justify-between font-black text-sm"><span id="modal-title">选装原子算子</span><button onclick="closeAddOperatorModal()">✕</button></div>
      <div class="p-5 space-y-4 text-xs">
        <label class="block font-bold">选择算子<select id="select-lib-op" onchange="changeOperatorSelection()" class="mt-1 w-full p-2.5 border rounded"></select></label>
        <div id="new-operator-fields" class="hidden space-y-3">
          <label class="block font-bold">新算子标识<input id="new-id" placeholder="custom.heat" class="w-full p-2 border rounded font-mono mt-1"></label>
          <label class="block font-bold">中文名称<input id="new-name" class="w-full p-2 border rounded mt-1"></label>
          <label class="block font-bold">代数公式<input id="new-eq" placeholder="y = x * 2" class="w-full p-2 border border-blue-300 rounded font-mono mt-1"></label>
          <div id="new-pins" class="space-y-2"></div>
        </div>
      </div>
      <div class="px-5 py-3 bg-paper-bg flex justify-end gap-3"><button onclick="closeAddOperatorModal()" class="text-xs font-bold">取消</button><button onclick="confirmNewOperator()" class="px-4 py-2 bg-paper-yellow border border-black text-xs font-black">确定插入流水线</button></div>
    </div>
  </div>

  <div id="modal-add-const" class="hidden fixed inset-0 z-50 bg-black/25 flex items-center justify-center">
    <div class="bg-white rounded shadow-xl w-[400px] border border-paper-border">
      <div class="px-5 py-4 bg-amber-100 flex justify-between text-sm font-black"><span>新增工程常量</span><button onclick="closeAddConstantModal()">✕</button></div>
      <div class="p-5 space-y-3 text-xs">
        <label class="block font-bold">变量标识<input id="new-const-id" placeholder="custom_efficiency" class="w-full mt-1 p-2 border rounded font-mono"></label>
        <label class="block font-bold">中文名称<input id="new-const-name" class="w-full mt-1 p-2 border rounded"></label>
        <label class="block font-bold">数值<input id="new-const-val" type="number" step="any" class="w-full mt-1 p-2 border rounded"></label>
        <label class="block font-bold">单位<input id="new-const-unit" value="/" class="w-full mt-1 p-2 border rounded"></label>
      </div>
      <div class="px-5 py-3 bg-paper-bg flex justify-end gap-3"><button onclick="closeAddConstantModal()" class="text-xs font-bold">取消</button><button onclick="confirmNewConstant()" class="px-4 py-2 bg-amber-400 border border-black text-xs font-black">添加常量至图纸</button></div>
    </div>
  </div>

  <script>
    "use strict";

    const clone = v => JSON.parse(JSON.stringify(v));
    const escapeHtml = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

      const m = {MWt: "MW", MWe: "MW", MWht: "MWh", "°C": "℃", "kJ/(kg·K)": "kJ/(kg·℃)", "1": "/"};
      return (m[a] || a) === (m[b] || b);

    const $ = id => document.getElementById(id);

    const BASELINE_DATA = {

      </div>`;
    }

    // 微型常量与输入胶囊 (130px, 纯中文)
    function renderConstantCard(pin, value, canEdit, extra = "") {
      return `<section data-node="input:${escapeHtml(pin.name)}" class="flow-node-box node-constant absolute p-1.5 ${extra}">
        <div class="flex items-center justify-between pb-0.5 mb-1 border-b border-amber-200/60">
          <span class="text-[11px] font-black text-softPin-constText truncate" title="${escapeHtml(pin.description)}">${escapeHtml(pin.description)}</span>
          <span class="w-1.5 h-1.5 rounded-full bg-softPin-constDot shrink-0"></span>
        </div>
        <div data-out="${escapeHtml(pin.name)}" class="flex items-center gap-1 font-mono">
          <input data-parameter="${escapeHtml(pin.name)}" aria-label="${escapeHtml(pin.description)}" type="number" step="any" value="${escapeHtml(value)}" ${canEdit ? "" : "disabled"} class="w-full min-w-0 px-1 py-0.5 text-right border border-softPin-constBorder rounded text-xs bg-white text-softPin-constText font-black disabled:bg-amber-50/50 focus:outline-none focus:ring-1 focus:ring-amber-400">
          <span class="shrink-0 text-[10px] text-amber-900 font-bold">${escapeHtml(pin.unit)}</span>
        </div>
      </section>`;
    }

    function renderInputCard(pin, value, canEdit, extra = "") {
      return `<section data-node="input:${escapeHtml(pin.name)}" class="flow-node-box node-input absolute p-1.5 ${extra}">
        <div class="flex items-center justify-between pb-0.5 mb-1 border-b border-green-200/60">
          <span class="text-[11px] font-black text-softPin-inText truncate" title="${escapeHtml(pin.description)}">${escapeHtml(pin.description)}</span>
          <span class="w-1.5 h-1.5 rounded-full bg-softPin-inDot shrink-0"></span>
        </div>
        <div data-out="${escapeHtml(pin.name)}" class="flex items-center gap-1 font-mono">
          <input data-parameter="${escapeHtml(pin.name)}" aria-label="${escapeHtml(pin.description)}" type="number" step="any" value="${escapeHtml(value)}" ${canEdit ? "" : "disabled"} class="w-full min-w-0 px-1 py-0.5 text-right border border-softPin-inBorder rounded text-xs bg-white text-softPin-inText font-black disabled:bg-green-50/50 focus:outline-none focus:ring-1 focus:ring-green-400">
          <span class="shrink-0 text-[10px] text-emerald-900 font-bold">${escapeHtml(pin.unit)}</span>
        </div>
      </section>`;
    }

    function renderStepCard(step, formula, pins, expression, result, isSelected) {
      const rows = pins.inputs.map(pin => pinRow(pin, step.input_map[pin.name], "in", result[step.input_map[pin.name]])).join("");
      const outputs = pins.outputs.map(pin => pinRow(pin, step.output_map[pin.name], "out", result[step.output_map[pin.name]])).join("");
      return `<section data-node="step:${escapeHtml(step.step_id)}" class="flow-node-box node-step absolute rounded-lg overflow-visible ${isSelected ? "selected" : ""}">
        <div class="px-3 py-2 rounded-t-lg text-xs font-black border-b bg-softPin-opBg text-softPin-opText border-softPin-opBorder flex items-center justify-between">
          <span class="truncate">${escapeHtml(formula.name)}</span>
          <span class="w-2 h-2 rounded-full bg-softPin-opDot shrink-0"></span>
        </div>
        <div class="p-3 text-[11px] space-y-2 bg-white rounded-b-lg">
          ${expression ? `<div data-formula class="font-mono text-[10.5px] text-blue-900 bg-blue-50/70 border border-blue-100 rounded px-2 py-1 break-words leading-relaxed">${escapeHtml(expression)}</div>` : ''}
          ${rows ? `<div class="space-y-0.5">${rows}</div>` : ''}
          ${outputs ? `<div class="border-t border-dashed border-purple-200 pt-1.5 space-y-0.5">${outputs}</div>` : ''}
        </div>
      </section>`;
    }

    // ======================== 方案 3 核心算法：正弦连续波浪 + 拱桥立交走线 ========================
    // 逻辑：
    // 1. 算子排列遵循纯平滑正弦波形：Y = 220 + 130 * sin(index * 0.75)
    // 2. 算子波浪推进，峰谷自然交替
    // 3. 跨度 > 1 的长距离跳跃连线，自动向上下外环拱起，形成如同高架立交桥般的飞跃走线（Arched Flyovers）
    function computeSinusoidalWaveLayout(pipeline) {
      const layout = {};
      const placedInputs = new Set();
      const stepSpacing = 320;
      const startX = 40;

      pipeline.steps.forEach((step, index) => {
        const stepX = startX + index * stepSpacing;
        // 柔和连续正弦波形，周期约为 8 个算子
        const waveY = 220 + Math.round(130 * Math.sin(index * 0.75));
        layout[`step:${step.step_id}`] = { left: stepX, top: waveY };

        const inputsForStep = Object.values(step.input_map).filter(varName => 
          pipeline.required_inputs.some(p => p.name === varName) && !placedInputs.has(varName)
        );

        inputsForStep.forEach((varName, inIdx) => {
          placedInputs.add(varName);
          const colOffset = (inIdx % 2) * 136;
          // 若算子位于上半波 (waveY <= 220)，输入放在其上方；若位于下半波，输入放在其下方
          const isUpper = (waveY <= 220);
          const baseInputY = isUpper ? Math.max(20, waveY - 60) : (waveY + 195);
          const rowOffset = Math.floor(inIdx / 2) * 52;
          layout[`input:${varName}`] = {
            left: stepX + colOffset,
            top: isUpper ? (baseInputY - rowOffset) : (baseInputY + rowOffset)
          };
        });
      });

      let unplacedIdx = 0;
      pipeline.required_inputs.forEach(pin => {
        if (!placedInputs.has(pin.name)) {
          layout[`input:${pin.name}`] = { left: startX + unplacedIdx * 136, top: 20 };
          unplacedIdx++;
        }
      });

      return layout;
    }

    function renderGraph() {
      const pipeline = sessionView.pipeline, calculation = sessionView.calculation_result;
      const result = Object.keys(pendingParameters).length ? {} : {...calculation?.initial_inputs, ...calculation?.final_outputs};
      const canEdit = activeStage === 2;
      const html = [];

      for (const pin of pipeline.required_inputs) {
        const val = pendingParameters[pin.name] ?? pin.default_value ?? "";
        html.push(pin.kind === "constant" ? renderConstantCard(pin, val, canEdit) : renderInputCard(pin, val, canEdit));
      }

      for (const step of pipeline.steps) {
        const formula = formulaById(step.formula_id);
        const pins = effectivePins(formula, step);
        const expression = formula.display_expressions?.[step.solve_target || formula.default_target] || formula.expression || "";
        html.push(renderStepCard(step, formula, pins, expression, result, selectedStepId === step.step_id));
      }

      $("node-layer").innerHTML = html.join("");

      const defaultLayout = computeSinusoidalWaveLayout(pipeline);
      const nodes = [...$("node-layer").children];
      let maxRight = 1200, maxBottom = 700;

      nodes.forEach(node => {
        const key = node.dataset.node;
        const savedPos = pipeline.layout[key];
        const defaultPos = defaultLayout[key] || { left: 40, top: 220 };

        const left = savedPos ? savedPos.left : defaultPos.left;
        const top = savedPos ? savedPos.top : defaultPos.top;

        node.style.left = left + "px";
        node.style.top = top + "px";

        maxRight = Math.max(maxRight, left + 340);
        maxBottom = Math.max(maxBottom, top + 260);
      });

      $("dag-workspace").style.width = maxRight + "px";
      $("dag-workspace").style.height = maxBottom + "px";
      $("dag-workspace").style.transform = `translate(${panX}px, ${panY}px)`;

      $("tab-stage-1").classList.toggle("bg-white", activeStage === 1);
      $("tab-stage-1").classList.toggle("shadow-xs", activeStage === 1);
      $("tab-stage-1").classList.toggle("text-paper-muted", activeStage !== 1);

      $("tab-stage-2").classList.toggle("bg-white", activeStage === 2);
      $("tab-stage-2").classList.toggle("shadow-xs", activeStage === 2);
      $("tab-stage-2").classList.toggle("text-paper-muted", activeStage !== 2);

      $("stage-desc-hint").textContent = activeStage === 1 ? "流程拓扑审核" : "参数核对与计算结果";
      $("btn-main-action").textContent = activeStage === 1 ? "确认场景拓扑" : "确认参数并计算";

      positionToolbar();
      scheduleWires();
    }

    function scheduleWires() {
      if (wireFrame !== null) cancelAnimationFrame(wireFrame);
      wireFrame = requestAnimationFrame(() => { wireFrame = null; drawWires(); });
    }

    // ======================== 拱桥外环立交走线引擎 ========================
    function drawWires() {
      const workspace = $("dag-workspace").getBoundingClientRect();
      const nodes = [...$("node-layer").children];

      const producers = new Map();
      for (const node of nodes) {
        for (const port of node.querySelectorAll("[data-out]")) {
          producers.set(port.dataset.out, {node, port});
        }
      }

      const paths = [];

      for (const node of nodes) {
        for (const port of node.querySelectorAll("[data-in]")) {
          const varName = port.dataset.in;
          const source = producers.get(varName);
          if (!source) continue;

          const sourceKey = source.node.dataset.node;
          const targetKey = node.dataset.node;

          const pa = source.port.getBoundingClientRect();
          const pb = port.getBoundingClientRect();
          const na = source.node.getBoundingClientRect();
          const nb = node.getBoundingClientRect();

          const from = { x: na.right - workspace.left, y: (pa.top + pa.bottom) / 2 - workspace.top };
          const to = { x: nb.left - workspace.left, y: (pb.top + pb.bottom) / 2 - workspace.top };

          let wireType = "wire-step";
          let markerId = "arrow-step";
          if (sourceKey.startsWith("input:")) {
            const isConst = source.node.classList.contains("node-constant");
            wireType = isConst ? "wire-constant" : "wire-input";
            markerId = isConst ? "arrow-const" : "arrow-input";
          }

          let activeClass = "";
          if (highlightedNode) {
            const isConnected = (sourceKey === highlightedNode.key || targetKey === highlightedNode.key);
            if (isConnected) {
              activeClass = "wire-highlight";
              markerId = "arrow-highlight";
            } else {
              activeClass = "wire-dimmed";
            }
          }

          let d = "";
          const dx = to.x - from.x;
          const dy = to.y - from.y;

          // 核心机制：长距离跨步（跨度 > 450px）自动采用拱桥立交路线
          if (dx > 450 && sourceKey.startsWith("step:") && targetKey.startsWith("step:")) {
            wireType = "wire-flyover";
            markerId = "arrow-flyover";
            // 判断向外高拱（天桥）还是向底深潜（地道）
            const archUp = ((from.y + to.y) / 2 < 260);
            const peakY = archUp ? 25 : 620; // 拱桥极值高度，完全避开所有波浪卡片
            d = `M ${from.x} ${from.y} C ${from.x + 60} ${peakY}, ${to.x - 60} ${peakY}, ${to.x} ${to.y}`;
          } else if (dx > 20) {
            // 近距离波浪自然过渡
            const curvature = Math.max(35, Math.min(160, dx * 0.42));
            d = `M ${from.x} ${from.y} C ${from.x + curvature} ${from.y}, ${to.x - curvature} ${to.y}, ${to.x} ${to.y}`;
          } else {
            const offsetX = 35;
            const midY = (from.y + to.y) / 2;
            d = `M ${from.x} ${from.y} C ${from.x + offsetX} ${from.y}, ${from.x + offsetX} ${midY}, ${(from.x + to.x) / 2} ${midY} S ${to.x - offsetX} ${to.y}, ${to.x} ${to.y}`;
          }

          paths.push(`<path class="wire-base ${wireType} ${activeClass}" data-from="${escapeHtml(sourceKey)}" data-to="${escapeHtml(targetKey)}" data-wire="${escapeHtml(varName)}" d="${d}" marker-end="url(#${markerId})"/>`);
        }
      }

      const defs = $("svg-wiring-layer").querySelector("defs").outerHTML;
      $("svg-wiring-layer").innerHTML = defs + paths.join("");
    }

    function positionToolbar() {
      const node = [...$("node-layer").children].find(item => item.dataset.node === `step:${selectedStepId}`);
      $("node-floating-toolbar").classList.toggle("hidden", !node);
      if (node) {
        $("node-floating-toolbar").style.left = node.style.left;
        $("node-floating-toolbar").style.top = (parseFloat(node.style.top) - 35) + "px";
      }
    }

    function switchStage(stage) { activeStage = stage; renderGraph(); }
    function handlePrimaryAction() {
      if (activeStage === 1) { activeStage = 2; renderGraph(); }
      else { alert("【参数核对与计算完成】所有工况数值已核实，计算结果已同步呈现！"); }
    }
    function resetLayoutPositions() { sessionView.pipeline.layout = {}; panX = 0; panY = 0; renderGraph(); }
    function openDrawer(stepId) {
      selectedStepId = stepId;
      drawerPipeline = clone(sessionView.pipeline);
      const step = sessionView.pipeline.steps.find(item => item.step_id === stepId);
      const formula = formulaById(step.formula_id);
      $("drawer-id").value = formula.id;
      $("drawer-name").value = formula.name;
      $("drawer-formula").value = formula.expression || "物性 / 查表函数";
      $("drawer-formula").readOnly = formula.type !== "algebraic";
      $("drawer-desc").value = formula.description;
      $("drawer-target-label").classList.toggle("hidden", !formula.solve_targets?.length);
      $("drawer-target").innerHTML = (formula.solve_targets || []).map(name => {
        const pin = formula.variables.find(item => item.name === name);
        return `<option value="${escapeHtml(name)}" ${name === (step.solve_target || formula.default_target) ? "selected" : ""}>${escapeHtml(pin?.description || name)} (${escapeHtml(pin?.unit || '/')})</option>`;
      }).join("");
      renderDrawerPins();
      $("operator-drawer").classList.remove("translate-x-full");
      positionToolbar();
      for (const node of $("node-layer").children) node.classList.toggle("selected", node.dataset.node === `step:${stepId}`);
    }
    function renderDrawerPins() {
      const variables = {};
      for (const pin of drawerPipeline.required_inputs) variables[pin.name] = pin;
      for (const step of drawerPipeline.steps) {
        for (const pin of effectivePins(formulaById(step.formula_id), step).outputs) variables[step.output_map[pin.name]] = pin;
      }
      const step = drawerPipeline.steps.find(item => item.step_id === selectedStepId);
      const pins = effectivePins(formulaById(step.formula_id), step);
      $("drawer-pins").innerHTML = pins.inputs.map(pin => {
        const currentVal = step.input_map[pin.name];
        const options = Object.entries(variables).map(([k, p]) => `<option value="${escapeHtml(k)}" ${k === currentVal ? "selected" : ""}>${escapeHtml(p.description)} · ${escapeHtml(k)} (${escapeHtml(p.unit)})</option>`).join("");
        return `<label class="block font-bold" data-pin="${escapeHtml(pin.name)}">${escapeHtml(pin.description)} (${escapeHtml(pin.unit)})<select data-source="${escapeHtml(pin.name)}" class="mt-1 w-full border rounded p-2 text-xs bg-white"><option value="">请选择来源</option>${options}</select></label>`;
      }).join("");
    }
    function changeSolveTarget() {
      const step = sessionView.pipeline.steps.find(item => item.step_id === selectedStepId);
      step.solve_target = $("drawer-target").value;
      renderDrawerPins();
    }
    function closeDrawer() {
      $("operator-drawer").classList.add("translate-x-full");
      selectedStepId = null;
      positionToolbar();
      for (const node of $("node-layer").children) node.classList.remove("selected");
    }
    function saveDrawer() {
      const step = sessionView.pipeline.steps.find(item => item.step_id === selectedStepId);
      if (step) {
        step.solve_target = $("drawer-target").value;
        $("drawer-pins").querySelectorAll("select").forEach(sel => { step.input_map[sel.dataset.source] = sel.value; });
      }
      closeDrawer();
      renderGraph();
    }
    function openAddOperatorModal(mode = "after") {
      insertionMode = mode;
      $("select-lib-op").innerHTML = sessionView.formulas.map(f => `<option value="${escapeHtml(f.id)}">${escapeHtml(f.name)} · ${escapeHtml(f.id)}</option>`).join("");
      $("modal-add-op").classList.remove("hidden");
    }
    function closeAddOperatorModal() { $("modal-add-op").classList.add("hidden"); }
    function changeOperatorSelection() {}
    function triggerInsertBefore() { openAddOperatorModal("before"); }
    function triggerInsertAfter() { openAddOperatorModal("after"); }
    function triggerReplace() { openAddOperatorModal("replace"); }
    function triggerDeleteCurrent() {
      if (!selectedStepId) return;
      sessionView.pipeline.steps = sessionView.pipeline.steps.filter(s => s.step_id !== selectedStepId);
      delete sessionView.pipeline.layout[`step:${selectedStepId}`];
      closeDrawer();
      renderGraph();
    }
    function confirmNewOperator() {
      const chosen = $("select-lib-op").value;
      const formula = formulaById(chosen);
      const newStep = { step_id: `custom_${formula.id.replace(/\./g, '_')}_${Date.now().toString().slice(-4)}`, formula_id: formula.id, input_map: {}, output_map: {} };
      for (const pin of formula.inputs) newStep.input_map[pin.name] = pin.name;
      for (const pin of formula.outputs) newStep.output_map[pin.name] = `${pin.name}_custom`;
      sessionView.pipeline.steps.push(newStep);
      closeAddOperatorModal();
      renderGraph();
    }
    function openAddConstantModal() { $("modal-add-const").classList.remove("hidden"); }
    function closeAddConstantModal() { $("modal-add-const").classList.add("hidden"); }
    function confirmNewConstant() {
      const id = $("new-const-id").value.trim() || `custom_const_${Date.now().toString().slice(-4)}`;
      const name = $("new-const-name").value.trim() || "自定义工程常量";
      const val = parseFloat($("new-const-val").value) || 1.0;
      const unit = $("new-const-unit").value.trim() || "/";
      sessionView.pipeline.required_inputs.push({ name: id, description: name, default_value: val, unit: unit, kind: "constant" });
      closeAddConstantModal();
      renderGraph();
    }

    function initInteractions() {
      const canvas = $("canvas-container");
      canvas.addEventListener("mouseover", event => {
        const node = event.target.closest("[data-node]");
        if (node && (!highlightedNode || highlightedNode.node !== node)) {
          highlightedNode = { node, key: node.dataset.node };
          scheduleWires();
        }
      });
      canvas.addEventListener("mouseout", event => {
        const node = event.target.closest("[data-node]");
        if (node && !event.relatedTarget?.closest(`[data-node="${node.dataset.node}"]`)) {
          highlightedNode = null;
          scheduleWires();
        }
      });
      canvas.addEventListener("pointerdown", event => {
        if (event.button !== 0 || event.target.closest("input,button,select,textarea")) return;
        const node = event.target.closest("[data-node]");
        drag = { node, startX: event.clientX, startY: event.clientY, left: node ? parseFloat(node.style.left) : panX, top: node ? parseFloat(node.style.top) : panY, moved: false, pointerId: event.pointerId };
        canvas.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
      canvas.addEventListener("pointermove", event => {
        if (!drag) return;
        const dx = event.clientX - drag.startX, dy = event.clientY - drag.startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
        if (!drag.moved) return;
        if (drag.node) {
          drag.node.style.left = (drag.left + dx) + "px";
          drag.node.style.top = (drag.top + dy) + "px";
          positionToolbar(); scheduleWires();
        } else {
          panX = drag.left + dx; panY = drag.top + dy;
          $("dag-workspace").style.transform = `translate(${panX}px, ${panY}px)`;
        }
      });
      canvas.addEventListener("pointerup", event => {
        if (!drag) return;
        const current = drag; drag = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        if (current.moved && current.node) {
          const key = current.node.dataset.node;
          sessionView.pipeline.layout[key] = { left: parseFloat(current.node.style.left), top: parseFloat(current.node.style.top) };
        } else if (!current.moved) {
          const key = current.node?.dataset.node || "";
          if (key.startsWith("step:")) openDrawer(key.slice(5));
          else closeDrawer();
        }
      });
      canvas.addEventListener("wheel", event => {
        if (event.target.closest("input,select")) return;
        event.preventDefault(); panX -= event.deltaX; panY -= event.deltaY;
        $("dag-workspace").style.transform = `translate(${panX}px, ${panY}px)`;
      }, {passive: false});
      window.addEventListener("resize", scheduleWires);
    }

    window.addEventListener("load", () => {
      initInteractions();
      renderGraph();
    });
  </script>
</body>
